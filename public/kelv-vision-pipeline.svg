<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">Kelv vision pipeline</title><desc id="desc">A camera frame is reduced to tracked pose landmarks and simple posture measurements over time.</desc>
  <defs><style>.paper{fill:#fbfbfa}.line{stroke:#0f172a;stroke-width:2;fill:none}.muted{stroke:#cbd5e1;stroke-width:1}.orange{stroke:#ea580c;stroke-width:3;fill:none}.dot{fill:#ea580c}.head{font:700 17px Arial,sans-serif;fill:#0f172a}.copy{font:14px Arial,sans-serif;fill:#475569}.mono{font:12px 'Courier New',monospace;fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}</style></defs>
  <rect class="paper" width="1440" height="430" rx="4"/><text class="head" x="42" y="46">vision / posture sampling</text><text class="mono" x="42" y="70">MOVENET SINGLEPOSE LIGHTNING / TENSORFLOW.JS / WEBGL</text>
  <rect class="card" x="42" y="104" width="263" height="262" rx="3"/><text class="mono" x="61" y="132">CAMERA FRAME</text><rect x="67" y="151" width="213" height="170" fill="#e2e8f0"/><circle cx="173" cy="205" r="21" fill="none" stroke="#64748b" stroke-width="2"/><path d="M173 226V274M134 245L173 238L212 245M146 306L173 274L200 306" stroke="#64748b" stroke-width="4" fill="none"/><path d="M73 331H274" class="muted"/><text class="copy" x="67" y="350">sampled during session</text>
  <path class="line" d="M305 235H388"/><path d="M370 226L388 235L370 244" fill="#0f172a"/>
  <rect class="card" x="389" y="104" width="382" height="262" rx="3"/><text class="mono" x="410" y="132">17 LANDMARKS + CONFIDENCE</text><g class="muted"><path d="M460 163H695M460 196H695M460 229H695M460 262H695M460 295H695M460 328H695"/><path d="M492 150V339M534 150V339M576 150V339M618 150V339M660 150V339"/></g><g class="orange"><path d="M576 177V218M535 224L576 218L617 224M548 293L576 258L604 293M576 258V218"/></g><g class="dot"><circle cx="576" cy="177" r="5"><animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/></circle><circle cx="535" cy="224" r="5"/><circle cx="617" cy="224" r="5"/><circle cx="576" cy="218" r="5"/><circle cx="548" cy="293" r="5"/><circle cx="604" cy="293" r="5"/></g><text class="copy" x="410" y="350">landmark score travels with every measurement</text>
  <path class="line" d="M771 235H854"/><path d="M836 226L854 235L836 244" fill="#0f172a"/>
  <rect class="card" x="855" y="104" width="543" height="262" rx="3"/><text class="mono" x="876" y="132">MEASUREMENTS OVER TIME</text><text class="copy" x="876" y="164">shoulder angle</text><text class="copy" x="876" y="208">head offset</text><text class="copy" x="876" y="252">torso lean</text><text class="copy" x="876" y="296">tracking confidence</text><g class="muted"><path d="M1010 158H1368M1010 202H1368M1010 246H1368M1010 290H1368"/></g><g class="orange"><path d="M1010 157C1060 140 1100 174 1150 154S1240 176 1290 151S1340 164 1368 148" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/></path><path d="M1010 202C1060 218 1100 185 1150 205S1240 184 1290 201S1340 190 1368 204" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/></path><path d="M1010 246C1060 232 1100 259 1150 244S1240 260 1290 245S1340 254 1368 242" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/></path><path d="M1010 290C1060 274 1100 278 1150 272S1240 282 1290 270S1340 280 1368 273" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/></path></g>
  <text class="mono" x="42" y="404">ACTIVE PATH: posture only. NO IDENTITY, EMOTION, DEMOGRAPHIC, PERSONALITY, OR EMPLOYMENT INFERENCE.</text>
</svg>
