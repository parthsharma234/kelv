<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title desc">
  <title id="title">Kelv posture pipeline</title><desc id="desc">A webcam frame becomes MoveNet keypoints, then geometric posture features and confidence-scored samples.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>.f{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.o{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.l{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}.t{font:700 16px Arial,sans-serif;fill:#0f172a}.c{font:14px Arial,sans-serif;fill:#475569}.m{font:12px 'Courier New',monospace;fill:#64748b}</style></defs>
  <rect class="f" x="1" y="1" width="1438" height="318" rx="4"/><text class="m" x="36" y="42">VISION PIPELINE</text>
  <rect class="b" x="36" y="82" width="224" height="136" rx="4"/><text class="t" x="56" y="119">Webcam frame</text><rect x="57" y="139" width="78" height="55" fill="#e2e8f0" stroke="#94a3b8"/><circle cx="96" cy="156" r="8" fill="none" stroke="#64748b"/><path d="M78 188L96 169L114 188" fill="none" stroke="#64748b" stroke-width="2"/><text class="c" x="153" y="162">video track</text><text class="m" x="56" y="246">getUserMedia</text>
  <rect class="b" x="362" y="82" width="224" height="136" rx="4"/><text class="t" x="382" y="119">MoveNet</text><text class="c" x="382" y="146">SinglePose Lightning</text><text class="c" x="382" y="170">TensorFlow.js / WebGL</text><text class="m" x="382" y="246">17 KEYPOINTS</text>
  <rect class="b" x="688" y="82" width="280" height="136" rx="4"/><text class="t" x="708" y="119">Geometric features</text><text class="c" x="708" y="148">shoulder angle</text><text class="c" x="708" y="172">head offset | torso lean</text><text class="m" x="708" y="246">EXPLAINABLE VALUES</text>
  <rect class="o" x="1070" y="82" width="334" height="136" rx="4"/><text class="t" x="1090" y="119">Posture sample</text><text class="c" x="1090" y="148">value + detector confidence</text><text class="c" x="1090" y="172">timestamp + capture quality</text><text class="m" x="1090" y="246">WEIGHTED BY LENS</text>
  <path class="l" d="M260 150H362"/><path class="l" d="M586 150H688"/><path class="l" d="M968 150H1070"/>
  <text class="m" x="36" y="281">No identity, demographic, emotion, or employment inference in the active posture path.</text>
</svg>
