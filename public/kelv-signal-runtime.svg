<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Kelv data flow</title>
  <desc id="desc">Camera, microphone, and live agent events are analyzed in the browser and combined into a local interview result.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>
      .frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.core{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.title{font:700 20px Arial,sans-serif;fill:#0f172a}.label{font:700 16px Arial,sans-serif;fill:#0f172a}.copy{font:14px Arial,sans-serif;fill:#475569}.mono{font:12px 'Courier New',monospace;fill:#64748b}
    </style>
  </defs>
  <rect class="frame" x="1" y="1" width="1438" height="518" rx="4"/>
  <text class="title" x="40" y="48">Kelv browser data flow</text><text class="copy" x="40" y="75">Capture, analysis, and persistence stay in the client for the active path.</text>
  <text class="mono" x="41" y="121">INPUTS</text><text class="mono" x="354" y="121">BROWSER ANALYSIS</text><text class="mono" x="781" y="121">FUSION</text><text class="mono" x="1128" y="121">OUTPUT</text>
  <rect class="box" x="40" y="146" width="220" height="74" rx="4"/><text class="label" x="58" y="177">Camera stream</text><text class="copy" x="58" y="202">getUserMedia video</text>
  <rect class="box" x="40" y="250" width="220" height="74" rx="4"/><text class="label" x="58" y="281">Microphone</text><text class="copy" x="58" y="306">WebM + AudioContext</text>
  <rect class="box" x="40" y="354" width="220" height="74" rx="4"/><text class="label" x="58" y="385">Agent events</text><text class="copy" x="58" y="410">ElevenLabs transcript</text>
  <rect class="box" x="354" y="146" width="292" height="74" rx="4"/><text class="label" x="372" y="177">MoveNet / WebGL</text><text class="copy" x="372" y="202">keypoints -&gt; posture samples</text>
  <rect class="box" x="354" y="250" width="292" height="74" rx="4"/><text class="label" x="372" y="281">Voice feature pass</text><text class="copy" x="372" y="306">pace, pauses, energy, pitch</text>
  <rect class="box" x="354" y="354" width="292" height="74" rx="4"/><text class="label" x="372" y="385">Transcript ledger</text><text class="copy" x="372" y="410">question / answer boundaries</text>
  <rect class="core" x="781" y="215" width="242" height="142" rx="4"/><text class="label" x="809" y="258">Kelv LENS</text><text class="copy" x="809" y="286">quality checks</text><text class="copy" x="809" y="310">question alignment</text><text class="copy" x="809" y="334">signal weighting</text>
  <rect class="box" x="1128" y="245" width="252" height="82" rx="4"/><text class="label" x="1148" y="278">SessionResultV2</text><text class="copy" x="1148" y="303">scores + coaching + metadata</text>
  <path class="line" d="M260 183H354"/><path class="line" d="M260 287H354"/><path class="line" d="M260 391H354"/>
  <path class="line" d="M646 183H732V251H781"/><path class="line" d="M646 287H781"/><path class="line" d="M646 391H732V321H781"/><path class="line" d="M1023 286H1128"/>
  <text class="mono" x="1128" y="365">browser-local persistence</text>
  <line x1="40" y1="466" x2="1380" y2="466" stroke="#e2e8f0"/>
  <text class="mono" x="40" y="492">EXPERIMENTAL, EXCLUDED FROM ACTIVE SCORING: facial-expression and eye-tracking prototypes</text>
</svg>
