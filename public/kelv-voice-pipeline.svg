<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title desc">
  <title id="title">Kelv voice pipeline</title><desc id="desc">A local audio recording and agent transcript are aligned into question-level delivery evidence.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>.f{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.o{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.l{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}.t{font:700 16px Arial,sans-serif;fill:#0f172a}.c{font:14px Arial,sans-serif;fill:#475569}.m{font:12px 'Courier New',monospace;fill:#64748b}</style></defs>
  <rect class="f" x="1" y="1" width="1438" height="318" rx="4"/><text class="m" x="36" y="42">VOICE PIPELINE</text>
  <rect class="b" x="36" y="82" width="224" height="136" rx="4"/><text class="t" x="56" y="119">Microphone</text><text class="c" x="56" y="148">local MediaRecorder</text><text class="c" x="56" y="172">WebM audio track</text><text class="m" x="56" y="246">LOCAL RECORDING</text>
  <rect class="b" x="362" y="82" width="254" height="136" rx="4"/><text class="t" x="382" y="119">Web Audio pass</text><text class="c" x="382" y="148">RMS | pitch | spectrum</text><text class="c" x="382" y="172">pauses | speaking rate</text><text class="m" x="382" y="246">AUDIO FEATURES</text>
  <rect class="b" x="718" y="82" width="254" height="136" rx="4"/><text class="t" x="738" y="119">Transcript ledger</text><text class="c" x="738" y="148">agent events + timestamps</text><text class="c" x="738" y="172">filler and answer boundaries</text><text class="m" x="738" y="246">TEXT EVIDENCE</text>
  <rect class="o" x="1074" y="82" width="330" height="136" rx="4"/><text class="t" x="1094" y="119">Question window</text><text class="c" x="1094" y="148">delivery features aligned</text><text class="c" x="1094" y="172">to one answer and its context</text><text class="m" x="1094" y="246">COACHING EVIDENCE</text>
  <path class="l" d="M260 150H362"/><path class="l" d="M616 150H718"/><path class="l" d="M972 150H1074"/>
  <text class="m" x="36" y="281">Live dialogue uses ElevenLabs Agents; recording-derived features are calculated in the browser after the session.</text>
</svg>
