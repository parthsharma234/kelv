<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">Kelv voice pipeline</title><desc id="desc">A recording and transcript are aligned on a timeline before the question-level delivery pass.</desc>
  <defs><style>.bg{fill:#fff}.border{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.axis{stroke:#94a3b8;stroke-width:1}.wave{stroke:#0f172a;stroke-width:2;fill:none}.orange{fill:#f97316}.orangeLine{stroke:#f97316;stroke-width:2;fill:none}.head{font:700 17px Arial,sans-serif;fill:#0f172a}.copy{font:14px Arial,sans-serif;fill:#475569}.mono{font:12px 'Courier New',monospace;fill:#64748b}.chip{fill:#fff7ed;stroke:#fed7aa;stroke-width:1}</style></defs>
  <rect class="bg" width="1440" height="430" rx="4"/><text class="head" x="42" y="46">voice / question-aligned review</text><text class="mono" x="42" y="70">MEDIARECORDER + WEB AUDIO + ELEVENLABS TRANSCRIPT EVENTS</text>
  <rect class="border" x="42" y="100" width="1356" height="220" rx="3"/><text class="mono" x="65" y="130">LOCAL WEBM RECORDING</text><path class="axis" d="M65 220H1368"/><path class="wave" d="M65 220L80 204L95 235L110 187L125 242L140 213L155 220L170 220L185 198L200 241L215 174L230 248L245 214L260 220L275 220L290 193L305 239L320 203L335 226L350 220L365 220L380 181L395 251L410 200L425 237L440 220L455 220L470 206L485 229L500 184L515 245L530 220L545 220L560 198L575 233L590 176L605 250L620 213L635 220L650 220L665 195L680 241L695 205L710 229L725 220L740 220L755 179L770 248L785 200L800 235L815 220L830 220L845 197L860 238L875 185L890 247L905 220L920 220L935 202L950 232L965 174L980 251L995 213L1010 220L1025 220L1040 189L1055 243L1070 206L1085 227L1100 220L1115 220L1130 181L1145 248L1160 201L1175 235L1190 220L1205 220L1220 196L1235 239L1250 184L1265 246L1280 220L1295 220L1310 204L1325 230L1340 191L1355 241L1368 220"/>
  <rect class="orange" x="343" y="145" width="238" height="150" opacity=".18"><animate attributeName="x" values="343;805;343" dur="5s" repeatCount="indefinite"/></rect><text class="mono" x="360" y="163">ANSWER WINDOW</text>
  <path class="axis" d="M65 278H1368"/><g class="mono"><text x="65" y="302">00:00</text><text x="375" y="302">02:00</text><text x="685" y="302">04:00</text><text x="995" y="302">06:00</text><text x="1300" y="302">08:00</text></g>
  <path class="orangeLine" d="M65 350H1368"/><circle class="orange" cx="343" cy="350" r="7"><animate attributeName="cx" values="343;805;343" dur="5s" repeatCount="indefinite"/></circle>
  <rect class="chip" x="66" y="365" width="220" height="38" rx="19"/><text class="copy" x="84" y="390">pace + pauses</text><rect class="chip" x="310" y="365" width="220" height="38" rx="19"/><text class="copy" x="328" y="390">filler language</text><rect class="chip" x="554" y="365" width="250" height="38" rx="19"/><text class="copy" x="572" y="390">RMS + pitch + spectrum</text><rect class="chip" x="828" y="365" width="286" height="38" rx="19"/><text class="copy" x="846" y="390">transcript boundaries</text>
</svg>
